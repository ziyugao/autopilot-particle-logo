const burstDuration=1.25;

const tickers=['AAPL','MSFT','NVDA','AMZN','GOOGL','META','TSLA','AMD','NFLX','JPM','V','WMT'];
const tickerPoints=points.filter(p=>p[4]===2?p[2]===-5:((p[0]+234)%28===0)).map((p,i)=>[p[0],p[1],p[4]===2?0:p[2],tickers[i%tickers.length],p[4]]);

}
