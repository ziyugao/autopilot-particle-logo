 else if(bursting){const u=(burstAge-.55)/.70;burst=1-u*u*(3-2*u);}
 pointer.vx*=Math.exp(-8*dt);pointer.vy*=Math.exp(-8*dt);
 for(const wave of waves)wave.age+=dt;
 waves=waves.filter(wave=>wave.age<(settings.radius+settings.width*3)/settings.speed);
 const projected=particles.map(q=>{
 const [x,y,z,ch,face,nx=1,ny=0]=q.p;
 const rx=x*cy+z*sy,rz=-x*sy+z*cy,p=1000/(1000-rz);
 const bx=w/2+rx*scale*p,by=h/2+y*scale*p;
 // Traveling, signed wave displacement: no sustained radial repulsion.
 let ox=0,oy=0;
 if(!bursting){for(const wave of waves){
 const dx=(bx-wave.x*w)/scale,dy=(by-wave.y*h)/scale;
 const d=Math.hypot(dx,dy),front=wave.age*settings.speed;
 const phase=(d-front)/settings.width;
 if(d>settings.radius||Math.abs(phase)>2.5)continue;
 const envelope=Math.exp(-phase*phase*1.6)*Math.exp(-wave.age*settings.decay)*(1-d/settings.radius);
 const displacement=Math.sin(phase*Math.PI*2)*settings.amplitude*envelope;
 const angle=d>.01?Math.atan2(dy,dx):q.i*2.39996;
 ox+=Math.cos(angle)*displacement;oy+=Math.sin(angle)*displacement;
 }}
 const length=Math.hypot(ox,oy),cap=settings.amplitude*1.6;
 if(length>cap&&length>0){ox*=cap/length;oy*=cap/length;}
 q.x=ox*scale;q.y=oy*scale;
 const angle=q.i*2.3999632297;
 const reach=(160+((q.i*73)%271))*scale;
 const ex=Math.cos(angle)*reach*burst,ey=Math.sin(angle)*reach*burst;
 let basis=null;
 if(face===2){
 const project=(xx,yy,zz)=>{const X=xx*cy+zz*sy,Z=-xx*sy+zz*cy,k=1000/(1000-Z);return [X*k,yy*k]};
 const o=project(x,y,z),u=project(x,y,z+1),v=project(x-ny,y+nx,z);
 basis=[(u[0]-o[0])/p,(u[1]-o[1])/p,(v[0]-o[0])/p,(v[1]-o[1])/p];
 }
 return {x:bx+q.x+ex,y:by+q.y+ey,z:rz,ch,p,face,basis};
 }).sort((a,b)=>a.z-b.z);
 for(const q of projected){
 if(q.ch===' ')continue;
 const toward=q.face===0?cy:q.face===1?-cy:Math.abs(sy);
 const light=.25+.65*Math.max(0,toward);
 const level=Math.round((light*(.84+.16*(q.z+260)/520))*255/16)*16;
 const brightness=Math.min(240,level);
 const g=glyph(q.ch,lightTheme?244-brightness:brightness);
 // Side glyphs lie in the YZ plane, rotated 90 degrees from the XY faces.
 const facing=q.face===2?Math.abs(sy):Math.abs(cy);
 if(facing<.025)continue;
 const gh=6.5*scale*q.p/24*40,gw=gh*.8*facing;
 if(q.basis){
 ctx.save();ctx.translate(q.x,q.y);ctx.transform(...q.basis,0,0);
 ctx.drawImage(g,-gh*.4,-gh/2,gh*.8,gh);ctx.restore();
 }else ctx.drawImage(g,q.x-gw/2,q.y-gh/2,gw,gh);
 }
 if(showRadius&&pointer.active&&!bursting){ctx.beginPath();ctx.arc(pointer.x,pointer.y,settings.radius*scale,0,Math.PI*2);ctx.strokeStyle=lightTheme?'rgba(0,0,0,.3)':'rgba(255,255,255,.3)';ctx.lineWidth=Math.max(1,scale*.6);ctx.stroke();}

}
function resize(){const d=Math.min(devicePixelRatio||1,2);const rect=canvas.getBoundingClientRect();canvas.width=Math.round(rect.width*d);canvas.height=Math.round(rect.height*d);draw(0)}
function move(e){
 const r=canvas.getBoundingClientRect(),now=performance.now();
 const x=(e.clientX-r.left)*canvas.width/r.width,y=(e.clientY-r.top)*canvas.height/r.height;
 const elapsed=Math.max(.008,(now-pointer.lastTime)/1000);
 if(pointer.active&&elapsed<.2){pointer.vx=Math.max(-2400,Math.min(2400,(x-pointer.x)/elapsed));pointer.vy=Math.max(-2400,Math.min(2400,(y-pointer.y)/elapsed));}
 else{pointer.vx=0;pointer.vy=0;}
 if(running&&!reduced.matches&&now-lastWave>=settings.interval&&Math.hypot(x-lastWaveX,y-lastWaveY)>4*(devicePixelRatio||1)){
 waves.push({x:x/canvas.width,y:y/canvas.height,age:0});if(waves.length>14)waves.shift();
 lastWave=now;lastWaveX=x;lastWaveY=y;
 }
 pointer.x=x;pointer.y=y;pointer.lastTime=now;pointer.active=true;
}
function explode(){
 waves=[];lightTheme=!lightTheme;burstAge=0;pointer.active=false;
 for(const q of particles){q.x=0;q.y=0;q.vx=0;q.vy=0;q.release=0;}
 document.getElementById('interaction-status').textContent='Double click to zoom in and out · Single click to burst';
 document.body.style.background=lightTheme?'#f4f4f4':'#030303';
 button.style.background=lightTheme?'#e5e5e5':'#14171b';
 button.style.color=lightTheme?'#171717':'#dddddd';
 button.style.borderColor=lightTheme?'#bcbcbc':'#30343b';
 draw(0);
}
canvas.style.cursor='pointer';canvas.tabIndex=0;
canvas.setAttribute('aria-label','Autopilot random ASCII particle logo. Move pointer to disrupt. Click or press Enter to invert colors and burst particles. Double-click to toggle zoom.');
// Defer single-click briefly so a double-click only changes zoom.
canvas.addEventListener('click',e=>{
 if(e.detail===0){explode();return;}
 if(clickTimer!==null){clearTimeout(clickTimer);clickTimer=null;}
 if(e.detail===1)clickTimer=setTimeout(()=>{clickTimer=null;explode()},350);
});
canvas.addEventListener('dblclick',e=>{
 e.preventDefault();if(clickTimer!==null){clearTimeout(clickTimer);clickTimer=null;}
 zoomTarget=zoomTarget===1?1.8:1;
 if(reduced.matches)zoom=zoomTarget;
 pointer.active=false;
 document.getElementById('interaction-status').textContent='Double click to zoom in and out · Single click to burst';
 draw(0);
});
const burstButton=document.getElementById('burst-button');
burstButton.addEventListener('click',explode);
document.getElementById('interaction-status').textContent='Double click to zoom in and out · Single click to burst';
canvas.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();explode()}});
canvas.addEventListener('pointermove',move);

canvas.addEventListener('pointerleave',()=>pointer.active=false);
canvas.addEventListener('pointercancel',()=>pointer.active=false);
canvas.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')pointer.active=false});
addEventListener('blur',()=>pointer.active=false);
addEventListener('resize',resize);resize();
function tick(now){const dt=last?Math.min((now-last)/1000,1/30):0;last=now;if(running)t+=dt;draw(running||burstAge<burstDuration||Math.abs(zoomTarget-zoom)>.001?dt:0);requestAnimationFrame(tick)}
function label(){button.textContent=running?'Pause':'Play';button.setAttribute('aria-label',running?'Pause animation':'Play animation')}
button.onclick=()=>{running=!running;label()};
reduced.addEventListener('change',e=>{running=!e.matches;label()});

label();requestAnimationFrame(tick);
</script></html>
